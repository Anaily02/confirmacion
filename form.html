<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formulario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3d3028; --soft:#c4896f; --blue:#7b93b8; --blue-bg:#e8eef5; --line:#d5dce8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Cormorant Garamond",Georgia,serif;
    color:var(--ink); background:transparent;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{width:100%;max-width:520px}
  label{display:block;font-size:22px;font-weight:600;margin:0 0 8px;line-height:1.25}
  .field{margin-bottom:26px}
  input,textarea{
    width:100%; font:inherit; font-size:20px; color:var(--ink);
    background:transparent; border:0; border-bottom:2px solid var(--line);
    padding:8px 2px; border-radius:0; outline:none; resize:none;
  }
  input:focus,textarea:focus{border-bottom-color:var(--blue)}
  button{
    font:inherit; font-size:20px; font-weight:600; color:var(--blue);
    background:#fff; border:1.5px solid var(--blue); border-radius:10px;
    padding:10px 28px; cursor:pointer;
  }
  button:hover{background:var(--blue-bg)}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  button:disabled{opacity:.6;cursor:default}
  .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
  .thanks{text-align:center}
  .check{
    width:64px;height:64px;border-radius:50%;background:var(--blue-bg);
    margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
  }
  .thanks h2{font-size:32px;line-height:1.15;margin:0 0 10px}
  .thanks p{font-size:20px;color:var(--soft);margin:0}
  .err{color:#b4533a;font-size:18px;margin:12px 0 0;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">

  <form id="f" novalidate>
    <div class="field">
      <label for="p1">Escribe aquí tu primera pregunta</label>
      <input id="p1" name="p1" required autocomplete="off">
    </div>
    <div class="field">
      <label for="p2">Escribe aquí tu segunda pregunta</label>
      <textarea id="p2" name="p2" rows="2" required></textarea>
    </div>
    <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
    <button type="submit">Enviar</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div class="thanks" id="ok" hidden>
    <div class="check" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#7b93b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h2>¡Gracias por completar este formulario!</h2>
    <p>Recibimos tus respuestas.</p>
  </div>

</div>
<script>
  // Más adelante pegaremos aquí la URL de Google Apps Script
  const ENDPOINT = 'URL_DE_APPS_SCRIPT';

  const form = document.getElementById('f');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err'); err.textContent = '';
    if (!form.p1.value.trim() || !form.p2.value.trim()) { err.textContent = 'Responde las dos preguntas.'; return; }
    const btn = form.querySelector('button'); btn.disabled = true;
    try {
      await fetch(ENDPOINT, { method:'POST', mode:'no-cors', body:new URLSearchParams(new FormData(form)) });
      form.hidden = true; document.getElementById('ok').hidden = false;
    } catch {
      btn.disabled = false; err.textContent = 'No se pudo enviar. Intenta de nuevo.';
    }
  });
</script>
</body>
</html>
